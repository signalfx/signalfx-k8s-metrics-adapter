name: Helm Test

on:
  push:
    branches:
      - main
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: "quay.io/signalfx"
  IMAGE_NAME: "k8s-metrics-adapter"
  IMAGE_VERSION: "latest"

jobs:
  get-test-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.test-matrix.outputs.matrix }}
      kind-version: ${{ steps.tool-versions.outputs.kind-version }}
      helm-version: ${{ steps.tool-versions.outputs.helm-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Get test matrix
        id: test-matrix
        run: echo "matrix=$(jq -c '.kubernetes_test' ci-matrix.json)" >> "$GITHUB_OUTPUT"

      - name: Get tool versions
        id: tool-versions
        run: make ci-tool-versions >> "$GITHUB_OUTPUT"

  build-image:
    name: build-image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build image
        run: |
          PUSH=no make image
          mkdir -p dist
          docker save -o dist/image.tar "${REGISTRY}/${IMAGE_NAME}:${IMAGE_VERSION}"

      - name: Save image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: ./dist/image.tar
          if-no-files-found: error
          retention-days: 1

  helm-lint:
    name: helm-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: get-test-matrix
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ needs.get-test-matrix.outputs.helm-version }}

      - name: Helm lint
        run: helm lint --strict --set accessToken=testing123 ./deployments/helm/signalfx-k8s-metrics-adapter

  helm-test:
    name: helm-test (${{ matrix.k8s-kind-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - get-test-matrix
      - helm-lint
      - build-image
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.get-test-matrix.outputs.matrix) }}
    env:
      K8S_VERSION: ${{ matrix.k8s-kind-version }}
      KIND_CLUSTER_NAME: metrics-adapter-test
      KUBECONFIG_TEST: /tmp/kube-config-signalfx-k8s-metrics-adapter-tests
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: ./dist

      - name: Load image
        run: docker load -i ./dist/image.tar

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ needs.get-test-matrix.outputs.helm-version }}

      - name: Create Kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: ${{ needs.get-test-matrix.outputs.kind-version }}
          node_image: kindest/node:${{ matrix.k8s-kind-version }}
          kubectl_version: ${{ matrix.k8s-kind-version }}
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          kubeconfig: ${{ env.KUBECONFIG_TEST }}
          wait: 180s

      - name: Run Helm test
        run: make test-helm IMAGE="${IMAGE_NAME}" VERSION="${IMAGE_VERSION}"
